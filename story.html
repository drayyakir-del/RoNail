<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronail — סטורי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#F7E1E3; --rose:#E8A0AE; --mauve:#C76B7E;
    --plum:#7A3247; --champagne:#EBD9C4; --gold:#C9A86A;
    --ink:#2E1A20; --cream:#FDF7F4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Heebo',sans-serif;background:#d9c4c8;
    display:flex;flex-direction:column;align-items:center;
    gap:22px;padding:30px;min-height:100vh;
  }

  /* ===== story canvas — 1080x1920 ===== */
  .ad{
    width:1080px;height:1920px;position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse at 80% 8%,rgba(232,160,174,.4),transparent 50%),
      radial-gradient(ellipse at 10% 95%,rgba(235,217,196,.55),transparent 50%),
      linear-gradient(165deg,var(--cream),#FBEEE8);
    transform-origin:top right;
    box-shadow:0 30px 80px -20px rgba(122,50,71,.4);
  }
  .frame{position:absolute;inset:40px;border:1.5px solid var(--gold);border-radius:22px;pointer-events:none}
  .frame::before{content:'';position:absolute;inset:11px;border:1px solid rgba(201,168,106,.3);border-radius:14px}

  /* header */
  .head{position:absolute;top:90px;right:0;left:0;text-align:center}
  .logo{font-family:'Cormorant Garamond',serif;font-size:76px;font-weight:600;color:var(--plum);letter-spacing:1px}
  .logo span{color:var(--gold);font-style:italic}
  .tag{font-size:21px;letter-spacing:8px;color:var(--mauve);text-transform:uppercase;margin-top:8px;font-weight:500}

  /* headline */
  .headline{position:absolute;top:270px;right:0;left:0;text-align:center;padding:0 130px}
  .headline h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:88px;line-height:1.05;color:var(--plum)}
  .headline h1 em{font-style:italic;color:var(--mauve)}

  /* hero photo — big, single */
  .hero-photo{
    position:absolute;top:450px;right:150px;left:150px;height:680px;
    border-radius:26px;overflow:hidden;
    box-shadow:0 26px 60px -20px rgba(122,50,71,.5);
  }
  .hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;color:#fff;
    background:linear-gradient(150deg,var(--rose),var(--plum));font-size:24px}
  .hero-photo .ph .ic{font-size:56px}
  .hero-photo .ph small{opacity:.85;font-size:18px}

  /* two small photos strip */
  .strip{position:absolute;top:1158px;right:150px;left:150px;display:grid;
    grid-template-columns:1fr 1fr;gap:18px;height:230px}
  .strip .slot{border-radius:18px;overflow:hidden;position:relative;
    box-shadow:0 16px 34px -14px rgba(122,50,71,.45)}
  .strip .slot img{width:100%;height:100%;object-fit:cover;display:block}
  .strip .slot .ph{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:38px}
  .strip .slot:nth-child(1) .ph{background:linear-gradient(150deg,var(--champagne),var(--gold))}
  .strip .slot:nth-child(2) .ph{background:linear-gradient(150deg,var(--rose),var(--mauve))}

  /* offer */
  .offer{position:absolute;top:1470px;right:0;left:0;text-align:center}
  .offer .pill{display:inline-block;background:var(--plum);color:#fff;
    padding:18px 50px;border-radius:60px;font-size:38px;font-weight:500;
    box-shadow:0 14px 34px -8px rgba(122,50,71,.5)}
  .offer .pill b{color:var(--blush);font-weight:700}
  .offer .sub{margin-top:12px;font-size:23px;color:#6b4f56;font-weight:300}

  /* footer */
  .foot{position:absolute;top:1640px;right:0;left:0;text-align:center}
  .foot .wa{font-size:42px;color:var(--plum);font-weight:700}
  .foot .loc{font-size:22px;color:var(--mauve);margin-top:8px;letter-spacing:2px}

  /* corner dots */
  .dots{position:absolute;width:150px;height:150px;opacity:.5}
  .dots.tl{top:70px;left:70px} .dots.br{bottom:70px;right:70px;transform:rotate(180deg)}

  /* swipe-up hint */
  .swipe{position:absolute;top:1790px;right:0;left:0;text-align:center;
    font-size:20px;color:var(--mauve);font-weight:300;letter-spacing:1px;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* ===== buttons ===== */
  .bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .dl,.pick{font-family:'Heebo';font-size:16px;font-weight:500;cursor:pointer;
    padding:14px 28px;border-radius:50px;border:none;transition:all .3s}
  .dl{background:var(--plum);color:#fff;box-shadow:0 10px 24px -8px rgba(122,50,71,.5)}
  .dl:hover{background:var(--mauve);transform:translateY(-2px)}
  .pick{background:#fff;color:var(--plum);border:1.5px solid var(--rose);display:inline-flex;align-items:center}
  .pick:hover{background:var(--blush)}

  .ad-shell{
    width:1080px;height:1920px;
    transform:scale(var(--s,1));
    transform-origin:top right;
  }
  body{--s:1;display:flex;flex-direction:column;align-items:center}
  /* .fit reserves the real on-screen size after scaling */
  .fit{
    width:calc(1080px * var(--s,1));
    height:calc(1920px * var(--s,1));
    overflow:hidden;
  }
</style>
</head>
<body>

<div class="fit" id="fit">
<div class="ad-shell">
<div class="ad" id="ad">
  <div class="frame"></div>

  <svg class="dots tl" viewBox="0 0 120 120"><g fill="#C9A86A">
    <circle cx="10" cy="10" r="3"/><circle cx="34" cy="10" r="3"/><circle cx="10" cy="34" r="3"/>
    <circle cx="58" cy="10" r="3"/><circle cx="10" cy="58" r="3"/><circle cx="34" cy="34" r="3"/>
  </g></svg>
  <svg class="dots br" viewBox="0 0 120 120"><g fill="#C9A86A">
    <circle cx="10" cy="10" r="3"/><circle cx="34" cy="10" r="3"/><circle cx="10" cy="34" r="3"/>
    <circle cx="58" cy="10" r="3"/><circle cx="10" cy="58" r="3"/><circle cx="34" cy="34" r="3"/>
  </g></svg>

  <div class="head">
    <div class="logo">Ro<span>nail</span></div>
    <div class="tag">סטודיו לציפורניים · באר שבע</div>
  </div>

  <div class="headline">
    <h1>יופי שמתחיל <em>בבריאות</em></h1>
  </div>

  <div class="hero-photo">
    <img id="img1" alt="">
    <div class="ph"><span class="ic">💅</span>תמונת עבודה מובילה<small>אנכית · גדולה</small></div>
  </div>

  <div class="strip">
    <div class="slot"><img id="img2" alt=""><div class="ph">✨</div></div>
    <div class="slot"><img id="img3" alt=""><div class="ph">🤍</div></div>
  </div>

  <div class="offer">
    <div class="pill">מצטלמת לעמוד? <b>50% הנחה</b></div>
    <div class="sub"> מספר מקומות מוגבל</div>
  </div>

  <div class="foot">
    <div class="wa">📱 053-522-1252</div>
    <div class="loc">RONAIL · BEER SHEVA</div>
  </div>
</div>
</div>
</div>

<div class="bar">
  <button class="dl" onclick="download()">⬇ הורד כתמונה</button>
 
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // scale the story to fit the screen width (max 1080)
  function fit(){
    const pad=28;
    const avail=Math.min(window.innerWidth - pad, 1080);
    const s=avail/1080;
    document.body.style.setProperty('--s', s);
  }
  fit();
  addEventListener('resize',fit);
  addEventListener('load',fit);

  function loadMulti(input){
    const files=[...input.files].slice(0,3);
    const ids=['img1','img2','img3'];
    files.forEach((f,i)=>{
      const r=new FileReader();
      r.onload=e=>{
        const img=document.getElementById(ids[i]);
        img.src=e.target.result;img.style.display='block';
        img.closest('.slot, .hero-photo')?.querySelector('.ph')?.remove();
      };
      r.readAsDataURL(f);
    });
  }
  [['img1','Work1.jpg'],['img2','Work3.jpg'],['img3','Work2.jpg']].forEach(([id,file])=>{
    const t=new Image();
    t.onload=()=>{
      const img=document.getElementById(id);
      img.src='images/'+file;
      img.style.display='block';            // hide the gradient placeholder
      img.closest('.slot, .hero-photo')?.querySelector('.ph')?.remove();
    };
    t.src='images/'+file;
  });
  function download(){
    const ad=document.getElementById('ad');
    const prev=getComputedStyle(document.body).getPropertyValue('--s');
    document.body.style.setProperty('--s','1'); // export at full 1080x1920
    html2canvas(ad,{width:1080,height:1920,scale:1,backgroundColor:null,useCORS:true})
      .then(canvas=>{
        document.body.style.setProperty('--s',prev); // restore screen fit
        const a=document.createElement('a');
        a.download='ronail-story.png';
        a.href=canvas.toDataURL('image/png');
        a.click();
      });
  }
</script>
</body>
</html>
